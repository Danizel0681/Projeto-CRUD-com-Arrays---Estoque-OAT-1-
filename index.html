<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estoque — Cadastro de Produtos (CRUD)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div>
    <h1>Estoque</h1>
    <p>Cadastro de produtos — Projeto CRUD com Arrays</p>
  </div>
  <div class="stamp" id="stamp">EM USO</div>
</header>

<main>
  <section class="card" aria-label="Formulário de cadastro">
    <h2 id="form-titulo">Novo produto</h2>
    <form id="form-produto">
      <label for="nome">Nome do produto</label>
      <input type="text" id="nome" required placeholder="Ex: Cadeira de escritório">

      <label for="categoria">Categoria</label>
      <select id="categoria">
        <option>Móveis</option>
        <option>Eletrônicos</option>
        <option>Alimentos</option>
        <option>Vestuário</option>
        <option>Papelaria</option>
        <option>Outro</option>
      </select>

      <label for="preco">Preço (R$)</label>
      <input type="number" id="preco" min="0" step="0.01" required placeholder="0,00">

      <label for="quantidade">Quantidade em estoque</label>
      <input type="number" id="quantidade" min="0" step="1" required placeholder="0">

      <div class="form-actions">
        <button type="submit" class="btn-primary" id="btn-salvar">Adicionar produto</button>
        <button type="button" class="btn-ghost" id="btn-cancelar" style="display:none;">Cancelar</button>
      </div>
      <p id="form-msg"></p>
    </form>
  </section>

  <section class="card" aria-label="Lista de produtos">
    <div class="list-head">
      <h2 style="border:none; margin:0; padding:0;">Produtos cadastrados</h2>
      <span id="contador">0 itens</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>Código</th>
          <th>Produto</th>
          <th>Categoria</th>
          <th>Preço</th>
          <th>Qtd.</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tabela-produtos"></tbody>
    </table>
    <p class="vazio" id="msg-vazio" style="display:none;">Nenhum produto cadastrado ainda. Use o formulário ao lado para começar.</p>
  </section>
</main>

<footer>
  OAT1 — Desenvolvimento de API's · Projeto CRUD com Arrays · Daniel Sodré Santos

</footer>

<script src="script.js"></script>
</body>
</html>
